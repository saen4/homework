<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/style.css">
  <title>Проблема с входом - Газпромбанк Бизнес-Онлайн</title>
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="header__wrapper">
        <a class="header__link" href="#" aria-label="Вернуться на главную страницу">
          <svg class="header__logo" width="203" height="50" aria-hidden="true">
            <use xlink:href="images/sprite.svg#logo"></use>
          </svg>
        </a>
        <div class="header__inner">
          <div class="header__text-wrapper">
            <span class="header__text-title">Топ-3 лучших банков для корпоративных клиентов</span>
            <span class="header__text-note">По версии Markswebb</span>
          </div>
          <div class="header__icon-wrapper">
            <svg class="header__icon" width="24" height="14" aria-hidden="true">
              <use xlink:href="images/sprite.svg#icon-markswebb"></use>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main>
    <section class="forgot-window">
      <div class="container">
        <h1 class="visually-hidden">Газпромбанк - бизнес онлайн</h1>
        <form class="forgot-form" action="#" method="POST">
          <fieldset class="forgot-form__group">
            <legend class="forgot-form__name">Не можете войти?</legend>
              <button class="forgot-form__btn btn btn--forgot-back" type="button">
                <svg class="forgot-form__btn-icon" width="20" height="20" aria-hidden="true">
                  <use xlink:href="images/sprite.svg#icon-arrowb"></use>
                </svg>
              </button>
              <div class="forgot-form__inner">
                <div class="custom-radio custom-radio--error">
                  <input type="radio" class="custom-radio__field visually-hidden" id="password" name="forgot">
                  <label for="password" class="custom-radio__label">
                    <span class="custom-radio__text">Установить новый пароль</span>
                  </label>
                </div>
                <div class="custom-radio">
                  <input type="radio" class="custom-radio__field visually-hidden" id="login" name="forgot">
                  <label for="login" class="custom-radio__label">
                    <span class="custom-radio__text">Восстановить логин</span>
                  </label>
                </div>
              </div>
              <button class="forgot-form__btn btn btn--forgot" type="submit" disabled>Продолжить</button>
          </fieldset>
        </form>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="container">
      <div class="footer__wrapper">
        <div class="footer__inner">
          <a class="footer__link" href="tel:+78001001189">
            <svg class="footer__link-icon" width="20" height="20" aria-hidden="true">
              <use xlink:href="images/sprite.svg#icon-phone"></use>
            </svg>
            <span class="footer__link-text">8 800 100 11 89</span>
          </a>
          <a class="footer__link" href="#">
            <svg class="footer__link-icon" width="20" height="20" aria-hidden="true">
              <use xlink:href="images/sprite.svg#icon-tg"></use>
            </svg>
            <span class="footer__link-text">Написать в Telegram</span>
          </a>
          <span class="footer__copyright">&copy;&nbsp;2024 Банк ГПБ (АО) Генеральная лицензия Банка России
            &#8470;&nbsp;354</span>
          <a class="footer__link" href="#">Политика обработки персональных данных</a>
        </div>
        <button class="footer__button" type="button">
          <span class="footer__button-text">Светлая тема</span>
          <svg class="footer__button-icon" width="20" height="20" aria-hidden="true">
            <use xlink:href="images/sprite.svg#icon-theme"></use>
          </svg>
        </button>
      </div>
    </div>
  </footer>
</body>

</html>
