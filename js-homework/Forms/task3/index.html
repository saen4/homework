<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js/index.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="main">
        <section class="design-choice">
            <div class="container">
                <h1 class="design-choice__title">Выберите дизайн карты</h1>
                <div class="design-choice__wrapper" action="#" method="post">
                    <div class="custom-input">
                        <input class="custom-input__field" type="text" id="name" name="name">
                        <label class="custom-input__label" for="name">Имя</label>
                    </div>
                    <div class="custom-input">
                        <input class="custom-input__field" type="text" id="surname" name="surname">
                        <label class="custom-input__label" for="surname">Фамилия</label>
                    </div>
                    <div class="custom-select">
                        <label for="colors" class="custom-select__label">Выберите цвет:</label>
                        <select class="custom-select__field" name="colors" id="colors">
                            <option value="red" >Красный</option>
                            <option value="blue">Синий</option>
                            <option value="green">Зеленый</option>
                        </select>
                    </div>
                </div>
                <div class="card">
                    <div class="card__wrapper">
                        <span class="card__number">0000 0000 0000 0000</span>
                        <div class="card__user-wrapper">
                            <span class="card__user card__user--name">Имя</span>
                            <span class="card__user card__user--surname">Фамилия</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
