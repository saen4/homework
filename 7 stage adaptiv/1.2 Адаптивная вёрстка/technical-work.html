<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/style.css">
    <title>Перфекционисты комфорта - Sminex - ИНТЕКО</title>
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header__content">
                <button class="header__menu" type="button" aria-label="Переключаетель меню">
                    <svg class="header__menu-icon" width="60" height="23" aria-hidden="true">
                        <use xlink:href="images/sprite.svg#icon-menu"></use>
                    </svg>
                </button>
                <a class="header__logo-link" href="perfectionists.html" aria-label="Переход на главную страницу">
                    <svg class="header__logo" width="114" height="26" aria-hidden="true">
                        <use xlink:href="images/sprite.svg#logo"></use>
                    </svg>
                </a>
            </div>
        </div>
    </header>
    <main>
        <section class="technical-work">
            <div class="container">
                <div class="technical-work__inner">
                    <h1 class="visually-hidden">Девелоперская компания Sminex</h1>
                    <h2 class="technical-work__title">Извините, на сайте проводятся технические работы</h2>
                    <div class="technical-work__description-wrapper">
                        <span class="technical-work__description">Примерное завершение технических работ в 12:00 МСК
                            05.04.2024</span>
                        <span class="technical-work__description">Присоединяйтесь к нам в социальных сетях</span>
                    </div>
                    <ul class="socials socials--technical-work">
                        <li class="socials__item">
                            <a class="socials__link" href="#" aria-label="Ссылка на Whatsapp">
                                <svg class="socials__icon" width="20" height="20" aria-hidden="true">
                                    <use xlink:href="images/sprite.svg#icon-wa"></use>
                                </svg>
                            </a>
                        </li>
                        <li class="socials__item">
                            <a class="socials__link" href="#" aria-label="Ссылка на Телеграм">
                                <svg class="socials__icon" width="22" height="18" aria-hidden="true">
                                    <use xlink:href="images/sprite.svg#icon-tg"></use>
                                </svg>
                            </a>
                        </li>
                        <li class="socials__item">
                            <a class="socials__link" href="#" aria-label="Ссылка на ВК">
                                <svg class="socials__icon" width="24" height="14" aria-hidden="true">
                                    <use xlink:href="images/sprite.svg#icon-vk"></use>
                                </svg>
                            </a>
                        </li>
                        <li class="socials__item">
                            <a class="socials__link" href="#" aria-label="Ссылка на Youtube">
                                <svg class="socials__icon" width="22" height="16" aria-hidden="true">
                                    <use xlink:href="images/sprite.svg#icon-youtube"></use>
                                </svg>
                            </a>
                        </li>
                        <li class="socials__item">
                            <a class="socials__link" href="#" aria-label="Ссылка на Yandex">
                                <svg class="socials__icon" width="20" height="20" aria-hidden="true">
                                    <use xlink:href="images/sprite.svg#icon-ya"></use>
                                </svg>
                            </a>
                        </li>
                        <li class="socials__item">
                            <a class="socials__link" href="#" aria-label="Ссылка на HH">
                                <svg class="socials__icon" width="20" height="20" aria-hidden="true">
                                    <use xlink:href="images/sprite.svg#icon-hh"></use>
                                </svg>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer footer--technical-work">
        <div class="container">
            <div class="footer__content">
                <div class="footer__contacts">
                    <a class="footer__contacts-mail"
                        href="mailto:contact-center@sminex.com">contact-center@sminex.com</a>
                    <a class="footer__contacts-tel" href="tel:+74954315390">+7 (495) 431-53-90</a>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
